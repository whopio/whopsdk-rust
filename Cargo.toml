[package]
name = "whop_sdk"
version = "1.0.13"
edition = "2021"
description = "The official Rust SDK for the Whop API."
license = "MIT"
repository = "https://github.com/whopio/whopsdk-rust"
documentation = "https://docs.whop.com/api-reference"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

