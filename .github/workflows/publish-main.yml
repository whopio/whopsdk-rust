name: Release

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify the crate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-whop-sdk-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRATE_NAME: whop_sdk
  MANIFEST: Cargo.toml
  LOCKFILE: Cargo.lock
  CONFIG_FILE: src/config.rs
  METADATA_FILE: .fern/metadata.json
  README_FILE: README.md
  LICENSE_FILE: LICENSE
  RESOURCE_DIR: src/api/resources
  MIN_RESOURCE_MODULES: "40"
  CRATES_IO_UA: "whopsdk-release (github.com/whopio/whopsdk-rust)"

jobs:
  decide:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      dry: ${{ steps.gate.outputs.dry }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Write the version-regression guard
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/version_ge.sh" <<'SH'
          version_ge() {
            if [ "$1" = "$2" ]; then
              return 0
            fi
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]
          }
          SH

      - name: Self-test the version-regression guard
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/version_ge.sh"
          failures=0

          check() {
            if version_ge "$1" "$2"; then
              actual=allow
            else
              actual=block
            fi

            if [ "$actual" = "$3" ]; then
              echo "ok: $1 vs $2 -> $actual"
            else
              echo "::error::version guard: $1 vs $2 expected $3, got $actual"
              failures=$((failures + 1))
            fi
          }

          check 1.0.11 1.0.11 allow
          check 1.0.12 1.0.11 allow
          check 1.0.11 1.0.12 block
          check 1.0.10 1.0.9 allow
          check 1.0.9 1.0.10 block
          check 1.10.0 1.9.0 allow
          check 1.9.0 1.10.0 block
          check 2.0.0 1.99.99 allow
          check 1.99.99 2.0.0 block

          [ "$failures" -eq 0 ]

      - name: Decide whether to release
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/version_ge.sh"

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          if [ "$EVENT" = "pull_request" ] || [ "$DRY_RUN" = "true" ]; then
            dry=true
          else
            dry=false
          fi
          emit dry "$dry"
          echo "event=${EVENT} ref=${GITHUB_REF} dry=${dry}"

          refuse() {
            if [ "$dry" = "true" ]; then
              echo "::warning::[dry] a real release would stop here: $*"
              return 0
            fi
            echo "::error::$*"
            exit 1
          }

          if [ ! -f "$MANIFEST" ]; then
            echo "::notice::${MANIFEST} does not exist — this is not a tree this workflow can release."
            emit release false
            emit version ""
            exit 0
          fi

          python3 - "$MANIFEST" > "${RUNNER_TEMP}/package.env" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as handle:
              package = tomllib.load(handle).get("package", {})

          version = package.get("version")
          license = package.get("license") or package.get("license-file")
          print("version=" + (version if isinstance(version, str) else ""))
          print("license=" + (license if isinstance(license, str) else ""))
          PY

          version=$(sed -n 's/^version=//p' "${RUNNER_TEMP}/package.env")
          license=$(sed -n 's/^license=//p' "${RUNNER_TEMP}/package.env")

          if [ -z "$version" ]; then
            echo "::error::${MANIFEST} has no [package] version."
            exit 1
          fi

          echo "${MANIFEST} version: ${version}"
          emit version "$version"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${version}' is not stable semver; prereleases are not released from main."
            exit 1
          fi

          if [ -z "$license" ]; then
            echo "::error::${MANIFEST} declares neither license nor license-file. crates.io rejects the upload, but cargo only warns and a dry run stays green, so this has to fail here."
            exit 1
          fi
          echo "${MANIFEST} license: ${license}"

          if [ ! -f "$LICENSE_FILE" ]; then
            refuse "${MANIFEST} claims ${license} but the tree carries no ${LICENSE_FILE}. cargo packages a crate without one and emits no warning at all, and the licence a published crate claims cannot be withdrawn."
          else
            license_ok=no
            case "$license" in
              MIT)
                if grep -qF 'MIT License' "$LICENSE_FILE"; then license_ok=yes; fi
                ;;
              Apache-2.0)
                if grep -qF 'Apache License' "$LICENSE_FILE" && grep -qF 'Version 2.0' "$LICENSE_FILE"; then license_ok=yes; fi
                ;;
              *)
                refuse "${MANIFEST} claims ${license}, which this workflow cannot check against ${LICENSE_FILE}. Teach it that identifier before releasing under it."
                license_ok=skipped
                ;;
            esac

            if [ "$license_ok" = "no" ]; then
              echo "::group::${LICENSE_FILE}"
              head -5 "$LICENSE_FILE"
              echo "::endgroup::"
              refuse "${MANIFEST} claims ${license} but ${LICENSE_FILE} does not read like ${license}. The manifest and the shipped file have to agree before the first publish."
            elif [ "$license_ok" = "yes" ]; then
              echo "${LICENSE_FILE} matches the declared ${license}."
            fi
          fi

          verdict=skip
          summary=""

          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            refuse "HEAD has no parent, so the only-version-changed check cannot run at all."
          elif ! git cat-file -e "HEAD^:${MANIFEST}" 2>/dev/null; then
            verdict=bad
            summary="${MANIFEST} did not exist in HEAD^; this commit introduces it rather than bumping a version."
          else
            git show "HEAD^:${MANIFEST}" > "${RUNNER_TEMP}/manifest.before"
            changed_files=$(git diff --name-only HEAD^ HEAD)
            changed_keys=$(python3 - "${RUNNER_TEMP}/manifest.before" "$MANIFEST" <<'PY'
          import sys
          import tomllib


          def flatten(node, prefix=""):
              flat = {}
              if isinstance(node, dict):
                  for key, value in node.items():
                      flat.update(flatten(value, f"{prefix}.{key}" if prefix else key))
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      flat.update(flatten(value, f"{prefix}[{index}]"))
              else:
                  flat[prefix] = node
              return flat


          def load(path):
              with open(path, "rb") as handle:
                  return flatten(tomllib.load(handle))


          before, after = load(sys.argv[1]), load(sys.argv[2])
          for key in sorted(set(before) | set(after)):
              if before.get(key) != after.get(key):
                  print(key)
          PY
          )

            if ! printf '%s\n' "$changed_keys" | grep -qxF 'package.version'; then
              verdict=noop
              summary="${MANIFEST} [package] version is unchanged between HEAD^ and HEAD."
            elif [ "$changed_keys" != "package.version" ]; then
              verdict=bad
              summary="a release commit must change [package] version and nothing else in ${MANIFEST}. Changed keys: $(printf '%s' "$changed_keys" | tr '\n' ' ')"
            elif [ "$changed_files" != "$MANIFEST" ]; then
              verdict=bad
              summary="a release commit must change ${MANIFEST} and nothing else. Changed files: $(printf '%s' "$changed_files" | tr '\n' ' ')"
            else
              verdict=good
            fi
          fi

          case "$verdict" in
            good)
              echo "HEAD bumps [package] version in ${MANIFEST} and changes nothing else."
              ;;
            noop)
              echo "::notice::${summary} There is nothing to release."
              if [ "$dry" = "false" ]; then
                emit release false
                exit 0
              fi
              ;;
            bad)
              if [ "$EVENT" = "pull_request" ]; then
                echo "::notice::[pull_request] this is not a release commit, so the diff is informational: ${summary}"
              else
                refuse "$summary"
              fi
              ;;
          esac

          crate_status=$(curl -sS --max-time 30 -o "${RUNNER_TEMP}/crate.json" -w '%{http_code}' \
            -H "User-Agent: ${CRATES_IO_UA}" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}" || echo 000)
          echo "crates.io returned HTTP ${crate_status} for ${CRATE_NAME}"

          case "$crate_status" in
            200)
              latest=$(python3 -c 'import json; print(json.load(open("'"${RUNNER_TEMP}"'/crate.json"))["crate"]["max_version"])' || true)
              if [ -z "$latest" ]; then
                refuse "crates.io answered 200 for ${CRATE_NAME} but the response carried no crate.max_version; refusing to guess the published version."
              else
                echo "Latest on crates.io: ${latest}"
                if version_ge "$version" "$latest"; then
                  echo "${version} is at or ahead of ${latest}."
                else
                  refuse "${MANIFEST} is at ${version} but crates.io already has ${latest}. This branch was generated before that release; regenerate it before merging."
                fi
              fi
              ;;
            404)
              echo "::warning::${CRATE_NAME} is not on crates.io. Publishing ${version} claims the name permanently and cannot be undone — yanking hides a version, it never deletes one."
              ;;
            *)
              refuse "crates.io returned HTTP ${crate_status} for ${CRATE_NAME}; refusing to guess the published version."
              ;;
          esac

          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "User-Agent: ${CRATES_IO_UA}" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${version}" || echo 000)
          echo "crates.io returned HTTP ${status} for ${CRATE_NAME} ${version}"

          published=unknown
          case "$status" in
            200) published=yes ;;
            404) published=no ;;
            *)
              refuse "crates.io returned HTTP ${status} for ${CRATE_NAME} ${version}; refusing to guess whether it is published."
              ;;
          esac

          if [ "$dry" = "true" ]; then
            echo "Dry run: packaging and verifying the crate, publishing nothing."
            emit release true
            exit 0
          fi

          if [ "$published" = "yes" ]; then
            echo "::notice::${CRATE_NAME} ${version} is already on crates.io; nothing to publish."
            emit release false
            exit 0
          fi

          emit release true

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - name: Refuse to package an empty SDK
        run: |
          set -euo pipefail
          count=$(find "$RESOURCE_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "${RESOURCE_DIR}: ${count} resource modules"
          if [ "$count" -lt "$MIN_RESOURCE_MODULES" ]; then
            echo "::error::only ${count} resource modules, expected at least ${MIN_RESOURCE_MODULES}. Fern emits an empty SDK and exits 0 when it cannot parse the spec, and a crates.io publish cannot be recalled."
            exit 1
          fi

      - name: Sync the version stamps
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" "$CONFIG_FILE" "$METADATA_FILE" "$README_FILE" "$CRATE_NAME" <<'PY'
          import json
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          config_path = pathlib.Path(sys.argv[2])
          metadata_path = pathlib.Path(sys.argv[3])
          readme_path = pathlib.Path(sys.argv[4])
          crate_name = sys.argv[5]
          stamped = 0

          if config_path.exists():
              text = config_path.read_text()
              text, count = re.subn(
                  r'("X-Fern-SDK-Version"\.to_string\(\),\s*")[^"]*', rf"\g<1>{version}", text
              )
              if count == 0:
                  sys.exit(f"::error::{config_path} exists but carries no X-Fern-SDK-Version stamp")
              config_path.write_text(text)
              stamped += count

          if metadata_path.exists():
              metadata = json.loads(metadata_path.read_text())
              for key in ("requestedVersion", "sdkVersion"):
                  if key in metadata:
                      metadata[key] = version
                      stamped += 1
              metadata_path.write_text(json.dumps(metadata, indent=2) + "\n")

          if readme_path.exists():
              text = readme_path.read_text()
              pattern = rf'(?m)^({re.escape(crate_name)}\s*=\s*")[0-9][^"]*'
              text, count = re.subn(pattern, rf"\g<1>{version}", text)
              if count == 0:
                  sys.exit(
                      f"::error::{readme_path} ships inside the crate and is the crates.io landing page, "
                      f'but it carries no `{crate_name} = "<version>"` install line to stamp'
                  )
              readme_path.write_text(text)
              stamped += count

          print(f"stamped {stamped} occurrence(s) with {version}")
          PY

          stale=$(grep -rIn --exclude-dir=.git --exclude-dir=target \
            -E "X-Fern-SDK-Version|^${CRATE_NAME}[[:space:]]*=[[:space:]]*\"[0-9]" . \
            | grep -E '[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -Fv "\"${VERSION}\"" || true)
          if [ -n "$stale" ]; then
            echo "::error::the tree still reports a version other than ${VERSION}:"
            printf '%s\n' "$stale"
            exit 1
          fi

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          cargo generate-lockfile
          if [ ! -f "$LOCKFILE" ]; then
            echo "::error::cargo generate-lockfile did not produce ${LOCKFILE}."
            exit 1
          fi
          echo "${LOCKFILE}: $(grep -c '^\[\[package\]\]' "$LOCKFILE") resolved packages"

      - name: Check the lockfile records this version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          locked=$(grep -A1 -F "name = \"${CRATE_NAME}\"" "$LOCKFILE" | sed -n 's/^version = "\(.*\)"$/\1/p' || true)
          if [ "$locked" != "$VERSION" ]; then
            echo "::error::${LOCKFILE} records ${CRATE_NAME} ${locked:-<missing>}, expected ${VERSION}."
            exit 1
          fi
          echo "${LOCKFILE} records ${CRATE_NAME} ${VERSION}"

      - name: Test
        run: cargo test --locked

      - name: Package and verify the crate
        id: package
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          cargo package --locked --allow-dirty

          crate="target/package/${CRATE_NAME}-${VERSION}.crate"
          if [ ! -f "$crate" ]; then
            echo "::error::cargo package did not produce ${crate}"
            ls -l target/package || true
            exit 1
          fi

          digest=$(sha256sum "$crate" | cut -d' ' -f1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${crate} -> sha256:${digest}"

      - name: Check the packaged crate ships the right version and licence
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/unpacked"
          mkdir -p "${RUNNER_TEMP}/unpacked"
          tar -xzf "target/package/${CRATE_NAME}-${VERSION}.crate" -C "${RUNNER_TEMP}/unpacked"

          root="${RUNNER_TEMP}/unpacked/${CRATE_NAME}-${VERSION}"
          failures=0

          for shipped in "$CONFIG_FILE" "$README_FILE"; do
            if [ ! -f "${root}/${shipped}" ]; then
              echo "::error::${shipped} is not in the packaged crate."
              failures=$((failures + 1))
            elif ! grep -qF "\"${VERSION}\"" "${root}/${shipped}"; then
              echo "::error::the packaged ${shipped} does not report ${VERSION}."
              grep -nE 'X-Fern-SDK-Version|^'"${CRATE_NAME}"'[[:space:]]*=' "${root}/${shipped}" || true
              failures=$((failures + 1))
            else
              echo "packaged ${shipped} reports ${VERSION}"
            fi
          done

          if [ ! -f "${root}/${LICENSE_FILE}" ]; then
            echo "::error::${LICENSE_FILE} is not in the packaged crate; the crate would claim a licence it does not carry."
            failures=$((failures + 1))
          else
            echo "packaged ${LICENSE_FILE} present"
          fi

          if ! grep -A1 -F "name = \"${CRATE_NAME}\"" "${root}/${LOCKFILE}" | grep -qF "version = \"${VERSION}\""; then
            echo "::error::the packaged ${LOCKFILE} does not record ${CRATE_NAME} ${VERSION}."
            failures=$((failures + 1))
          else
            echo "packaged ${LOCKFILE} records ${CRATE_NAME} ${VERSION}"
          fi

          [ "$failures" -eq 0 ]

      - name: Exercise the publish path
        run: cargo publish --dry-run --locked --no-verify --allow-dirty

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 7

      - name: Collect the stamped files
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/stamps"
          mkdir -p "${RUNNER_TEMP}/stamps"
          for tracked in "$MANIFEST" "$LOCKFILE" "$CONFIG_FILE" "$METADATA_FILE" "$README_FILE"; do
            if [ -f "$tracked" ]; then
              mkdir -p "${RUNNER_TEMP}/stamps/$(dirname "$tracked")"
              cp "$tracked" "${RUNNER_TEMP}/stamps/${tracked}"
            fi
          done
          find "${RUNNER_TEMP}/stamps" -type f

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stamps
          path: ${{ runner.temp }}/stamps
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true' && needs.decide.outputs.dry == 'false'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stamps
          path: ${{ runner.temp }}/stamps

      - name: Check the token is present
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not readable from the crates-io environment; the upload would fail after the build."
            exit 1
          fi

      - name: Restore the stamped tree
        run: |
          set -euo pipefail
          cp -R "${RUNNER_TEMP}/stamps/." .
          if [ ! -f "$LOCKFILE" ]; then
            echo "::error::${LOCKFILE} is not in the stamps artifact. Without it cargo resolves dependencies again here and can upload a different tree than the one the build job verified."
            exit 1
          fi
          git --no-pager diff --stat

      - name: Repackage and match the verified crate
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          EXPECTED: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cargo package --locked --allow-dirty --no-verify

          digest=$(sha256sum "target/package/${CRATE_NAME}-${VERSION}.crate" | cut -d' ' -f1)
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::this job packaged sha256:${digest} but the build job verified sha256:${EXPECTED}. Refusing to upload bytes that were never verified."
            exit 1
          fi
          echo "sha256:${digest} matches the crate the build job verified"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
          EXPECTED: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cargo publish --locked --no-verify --allow-dirty

          uploaded="target/package/tmp-crate/${CRATE_NAME}-${VERSION}.crate"
          if [ -f "$uploaded" ]; then
            digest=$(sha256sum "$uploaded" | cut -d' ' -f1)
            echo "cargo publish repackaged sha256:${digest}"
            if [ "$digest" != "$EXPECTED" ]; then
              echo "::warning::cargo publish uploaded sha256:${digest}, not the verified sha256:${EXPECTED}. The version is already on crates.io and cannot be withdrawn — audit it before announcing."
            fi
          fi

  tag:
    needs: [decide, build, publish]
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.dry == 'false' && needs.decide.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the published version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail

          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "User-Agent: ${CRATES_IO_UA}" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}" || echo 000)
          if [ "$status" != "200" ]; then
            echo "::notice::${CRATE_NAME} ${VERSION} is not on crates.io (HTTP ${status}); nothing to tag."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "${CRATE_NAME} ${VERSION}"

          git push origin "refs/tags/v${VERSION}" || \
            git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null
